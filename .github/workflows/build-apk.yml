name: Build Android APK

on:
  workflow_dispatch:        # run it any time from the Actions tab
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk KebunBerhantu-v1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KebunBerhantu-APK
          path: android/KebunBerhantu-v1.0.apk
